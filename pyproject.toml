[project]
name = "inventory_tools"
version = "15.19.1"
description = "Inventory Tools for ERPNext"
authors = [
    { name = "AgriTheory", email = "support@agritheory.dev"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "matplotlib>=3.10.1",
    "mip>=1.14",
    "networkx>=3.4.2",
    "numpy>=2.0.2",
    "packaging>=24,<25",
    "pillow>=13.0.0",
    "typing-extensions>=4.14,<4.16",
]

[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
hrms = ">=15.0.0,<16.0.0"
webshop = ">=0.0.1"

[tool.bench.dev-dependencies]
pytest = "~=9.0.3"
pytest-cov = "~=5.0.0"
pytest-order = "~=1.2.1"
test_utils = "@git+https://github.com/agritheory/test_utils.git#egg=test_utils"
pygments = "~=2.20.0"

[tool.codespell]
skip = "CHANGELOG.md"

[tool.pytest.ini_options]
addopts = "-s --disable-warnings" #--cov=inventory_tools --cov-report term-missing"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "inventory_tools/__init__.py:__version__"
]
build_command = "echo 1"

[tool.semantic_release.branches.version]
match = "version-(14|15)"
